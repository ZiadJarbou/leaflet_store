# /etc/nginx/sites-available/leafletai.ai
# Symlink to: /etc/nginx/sites-enabled/leafletai.ai

server {
    listen 80;
    listen [::]:80;
    server_name leafletai.ai www.leafletai.ai;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leafletai.ai www.leafletai.ai;

    # ── SSL (filled in by certbot) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/leafletai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leafletai.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # ── Static frontend (Vite build output) ────────────────────────
    root /var/www/leafletai/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API — proxy to Node.js on port 4000 ────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        client_max_body_size 25m;
        proxy_read_timeout   120s;
    }

    # ── Uploaded files — proxy to Node.js ──────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── React SPA — fallback to index.html ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
